# /etc/sysctl.d/99-schwab-lowmem.conf — canonical source (deployed 2026-11-12)
#
# The prod VPS (google-vps-next) has 958MB RAM and shares the box with ad-hoc
# dev loads. Default swappiness=60 let the serving uvicorn process get swapped
# out (79MB) under a `go test` compile storm; every request then stalled in
# do_swap_page (30s+ timeouts, "active" process, clean journal).
#
# swappiness=20: keep anonymous pages (the Python heap) resident longer;
# reclaim file cache first. Combined with the service unit's MemoryLow=400M
# (deploy/schwab-trader.service) this keeps the API responsive under external
# memory pressure. Any future change must be made here first, then deployed.
vm.swappiness = 20
